<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Céntimo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#151a2c">
<meta name="description" content="Céntimo: juego de cartas de finanzas personales para 2 a 10 jugadores, cada uno en su celular.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Céntimo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: una mesa de juego a pantalla completa — jugadores arriba, mesa al centro, tu mano abajo. */
:root {
  --mesa: #151a2c;
  --mesa-2: #1e2540;
  --linea: #323a5c;
  --texto: #eef0f8;
  --suave: #a3a9c4;
  --oro: #f4b83a;
  --oro-tinta: #2a1d00;
  --ahorro: #2f9c5e;
  --necesidad: #2f6fd6;
  --gusto: #d9443b;
  --ingreso: #f2b630;
  --comodin: #14161d;
  --papel: #fffdf7;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, var(--mesa-2), var(--mesa) 70%) fixed, var(--mesa);
  color: var(--texto);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 16px 32px; }

/* Botones */
.btn {
  border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700;
  background: var(--mesa-2); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea);
  min-height: 48px;
}
.btn:hover { box-shadow: inset 0 0 0 2px var(--suave); }
.btn.primario { background: var(--oro); color: var(--oro-tinta); box-shadow: 0 4px 0 #b9821a; }
.btn.primario:hover { filter: brightness(1.05); }
.btn.primario:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9821a; }
.btn.peligro { background: var(--gusto); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.chico { min-height: 36px; padding: 6px 12px; font-size: 14px; }

/* ---------- Inicio ---------- */
.portada { display: grid; gap: 24px; }
.logo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.moneda {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #ffe08a, var(--oro) 55%, #b9821a);
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--oro-tinta);
  box-shadow: 0 0 0 4px #b9821a55;
}
.logo h1 { font-size: clamp(44px, 9vw, 72px); font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.logo p { margin: 4px 0 0; color: var(--suave); max-width: 46ch; }
.panel { background: #0f1322cc; border: 1px solid var(--linea); border-radius: 18px; padding: 20px; display: grid; gap: 16px; }
.panel h2 { font-size: 22px; }
.contador { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.contador .n { font-family: var(--display); font-size: 40px; font-weight: 800; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.contador .redondo { width: 48px; height: 48px; border-radius: 50%; padding: 0; font-size: 24px; }
.lista-jug { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.fila-jug { display: flex; gap: 8px; align-items: center; background: var(--mesa); border: 1px solid var(--linea); border-radius: 12px; padding: 8px; }
.fila-jug input {
  flex: 1; min-width: 0; background: transparent; border: 0; color: var(--texto); font: inherit; font-weight: 600; padding: 8px;
}
.seg { display: flex; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--linea); flex: none; }
.seg button { border: 0; background: transparent; padding: 8px 10px; font-size: 13px; font-weight: 700; color: var(--suave); }
.seg button[aria-pressed="true"] { background: var(--oro); color: var(--oro-tinta); }
.nota { color: var(--suave); font-size: 14px; margin: 0; }
.acciones-inicio { display: flex; gap: 12px; flex-wrap: wrap; }
.acciones-inicio .primario { flex: 1 1 220px; font-size: 18px; }
.muestra { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Cartas ---------- */
.carta {
  --cc: var(--comodin);
  --w: clamp(66px, 17vw, 92px);
  width: var(--w); aspect-ratio: 5 / 7.4; max-width: 100%;
  border: 0; border-radius: 12px; padding: 5px;
  background: var(--cc); color: #fff;
  display: grid; grid-template-rows: auto 1fr auto; position: relative;
  box-shadow: 0 3px 0 #0006, 0 8px 18px #0005;
  transition: transform .15s ease, opacity .15s ease, box-shadow .15s;
  text-align: center; flex: none;
}
.carta .inner {
  grid-row: 1 / -1; grid-column: 1; background: var(--papel); color: var(--cc); border-radius: 8px;
  display: grid; grid-template-rows: auto 1fr auto; padding: 4px 3px; min-height: 0; overflow: hidden;
}
.carta .cat { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.carta .big { font-family: var(--display); font-weight: 800; font-size: calc(var(--w) * .46); line-height: 1; align-self: center; }
.carta .nm { font-size: 10px; font-weight: 700; line-height: 1.15; color: #262a3a; }
.carta .amt { font-size: 9px; color: #5b6075; line-height: 1.15; }
.c-g { --cc: var(--ahorro); } .c-b { --cc: var(--necesidad); } .c-r { --cc: var(--gusto); }
.c-y { --cc: #c48a0c; background: var(--ingreso); }
.c-k { background: conic-gradient(var(--ahorro) 0 25%, var(--necesidad) 0 50%, var(--gusto) 0 75%, var(--ingreso) 0); }
.c-k .inner { background: var(--comodin); color: #fff; }
.c-k .nm { color: #fff; } .c-k .amt { color: #c5c9da; }
.carta.dorso { background: repeating-linear-gradient(45deg, #2a3358 0 8px, #222a4a 8px 16px); }
.carta.dorso .inner { background: transparent; color: var(--oro); place-items: center; grid-template-rows: 1fr; }
.carta.grande { --w: clamp(96px, 26vw, 128px); }
.carta.grande .cat { font-size: 11px; } .carta.grande .nm { font-size: 13px; } .carta.grande .amt { font-size: 11px; }

.mano .carta.jugable { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--oro), 0 10px 20px #0007; }
.mano .carta.jugable:hover { transform: translateY(-14px); }
.mano .carta.nojugable { opacity: .45; }
.mano .carta.nueva { animation: nueva .6s ease; }
@keyframes nueva { from { transform: translateY(-40px) scale(1.1); } }
.sacude { animation: sacude .35s; }
@keyframes sacude { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- Juego ---------- */
.juego { display: grid; gap: 14px; }
.barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.barra .marca { display: flex; gap: 10px; align-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; }
.barra .marca .moneda { width: 34px; height: 34px; font-size: 16px; box-shadow: none; }
.barra .ronda { color: var(--suave); font-size: 14px; font-family: var(--body); font-weight: 600; }
.barra .der { display: flex; gap: 8px; }

.jugadores { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.chip {
  flex: none; display: grid; gap: 2px; min-width: 104px; padding: 8px 10px; border-radius: 12px;
  background: var(--mesa); border: 1px solid var(--linea);
}
.chip.activo { border-color: var(--oro); box-shadow: 0 0 0 2px var(--oro); }
.chip .nombre { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.chip .info { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--suave); font-variant-numeric: tabular-nums; }
.chip .mini { width: 10px; height: 14px; border-radius: 2px; background: #3a4470; box-shadow: inset 0 0 0 1px #6873a6; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
.badge.escudo { background: var(--ahorro); color: #fff; }
.badge.ultimo { background: var(--gusto); color: #fff; }
.badge.bot { background: #3a4470; color: #dfe3f5; }

.centro { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 10px 0; }
.pila { justify-self: end; display: grid; gap: 6px; justify-items: center; }
.pila .carta.dorso { cursor: pointer; }
.pila .carta.dorso:disabled { cursor: default; }
.pila small, .descarte small { color: var(--suave); font-size: 12px; font-variant-numeric: tabular-nums; }
.descarte { display: grid; gap: 6px; justify-items: center; }
.estado { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.color-actual { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--mesa); border: 1px solid var(--linea); font-weight: 700; font-size: 14px; }
.color-actual i { width: 22px; height: 22px; border-radius: 50%; background: var(--cc); display: block; }
.sentido { color: var(--suave); font-size: 14px; }

.mensaje {
  background: var(--papel); color: #20243a; border-radius: 14px; padding: 12px 16px;
  font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 52px;
}
.mensaje.alerta { background: #ffe1dd; color: #6b140e; }
.mensaje .quien { font-family: var(--display); font-weight: 800; font-size: 20px; }

.zona-mano { background: #0f1322cc; border: 1px solid var(--linea); border-radius: 18px; padding: 14px; display: grid; gap: 12px; }
.zona-mano .titulo { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.zona-mano h2 { font-size: 20px; }
.pista { color: var(--suave); font-size: 14px; margin: 0; }
.pista b { color: var(--texto); }
.aviso-nec { background: #1f3a73; color: #dbe7ff; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.mano { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; min-height: 120px; align-items: flex-end; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; }
.acciones .btn { flex: 1 1 160px; }
.btn.dicho { background: var(--ahorro); color: #fff; box-shadow: none; }
.acusar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #3b1714; border: 1px solid var(--gusto); border-radius: 12px; padding: 10px 12px; }
.acusar p { margin: 0; flex: 1 1 200px; }
.espera { color: var(--suave); padding: 20px 0; text-align: center; }

.bitacora { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--suave); }
.bitacora li:first-child { color: var(--texto); }

/* ---------- Capas ---------- */
.capa {
  position: fixed; inset: 0; z-index: 20; background: #080a12e6; display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.caja { background: var(--mesa-2); border: 1px solid var(--linea); border-radius: 20px; padding: 22px; width: min(560px, 100%); display: grid; gap: 14px; }
.caja h2 { font-size: 26px; }
.caja p { margin: 0; }
.caja ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.caja .botones { display: flex; gap: 10px; flex-wrap: wrap; }
.caja .botones .btn { flex: 1 1 160px; }
.cortina .caja { text-align: center; justify-items: center; }
.cortina .grande-nombre { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 9vw, 56px); line-height: 1.05; color: var(--oro); }
.cortina ul { text-align: left; color: var(--suave); font-size: 14px; margin: 0; padding-left: 18px; }
.elige-color { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.elige-color button { border: 0; border-radius: 14px; padding: 18px 10px; font-weight: 800; font-size: 17px; color: #fff; background: var(--cc); }
.elige-color button small { display: block; font-weight: 600; font-size: 12px; opacity: .85; }
.elige-color .c-y { color: var(--oro-tinta); }
.reglas ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.reglas li b { color: var(--oro); }
.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th, .tabla td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linea); }
.tabla td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.tabla th.num { text-align: right; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.tag.cerrado { background: var(--ahorro); color: #fff; }
.tag.justo { background: var(--ingreso); color: var(--oro-tinta); }
.tag.rojo { background: var(--gusto); color: #fff; }
.scroll-x { overflow-x: auto; }
.leccion { background: var(--papel); color: #20243a; border-radius: 12px; padding: 12px 14px; font-size: 14px; }

@media (max-width: 560px) {
  .centro { grid-template-columns: auto auto; justify-content: center; }
  .estado { grid-column: 1 / -1; justify-items: center; }
  .pila { justify-self: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Modo en línea ---------- */
.opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.opcion {
  text-align: left; display: grid; gap: 6px; align-content: start; padding: 18px; border-radius: 16px;
  background: #0f1322cc; border: 1px solid var(--linea); min-height: 120px;
}
.opcion:hover { border-color: var(--suave); }
.opcion b { font-family: var(--display); font-size: 22px; font-weight: 800; }
.opcion span { color: var(--suave); font-size: 15px; }
.opcion.destacada { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro); }
.opcion.destacada b { color: var(--oro); }
.retomar { display: flex; gap: 10px; flex-wrap: wrap; }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 700; font-size: 14px; color: var(--suave); }
.campo input {
  background: var(--mesa); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px;
  color: var(--texto); font: inherit; font-size: 18px; font-weight: 600; width: 100%;
}
.campo input.codigo-in { font-family: var(--display); font-size: 32px; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.error { background: #3b1714; border: 1px solid var(--gusto); color: #ffd9d4; border-radius: 12px; padding: 10px 12px; margin: 0; }
.sala-cab { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.codigo { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 15vw, 84px); letter-spacing: .14em; color: var(--oro); line-height: 1; font-variant-numeric: tabular-nums; }
.qr { background: #fff; padding: 8px; border-radius: 12px; width: 156px; max-width: 100%; line-height: 0; }
.qr svg { width: 100%; height: auto; }
.enlace { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.enlace code { background: var(--mesa); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; flex: 1 1 220px; min-width: 0; user-select: all; }
.lista-sala { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lista-sala li { display: flex; align-items: center; gap: 10px; background: var(--mesa); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; flex-wrap: wrap; }
.lista-sala .nombre { font-weight: 700; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--ahorro); flex: none; }
.punto.off { background: var(--gusto); }
.badge.tu { background: var(--oro); color: var(--oro-tinta); }
.badge.off { background: var(--gusto); color: #fff; }
.badge.anfitrion { background: #3a4470; color: #dfe3f5; }
.red-aviso { background: #3b2a08; border: 1px solid var(--oro); color: #ffe7b0; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.esperando { display: flex; align-items: center; gap: 10px; color: var(--suave); }
.esperando::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--oro); border-right-color: transparent; animation: gira 1s linear infinite; flex: none; }
@keyframes gira { to { transform: rotate(360deg); } }
.turno-tuyo { color: var(--oro); }
@media (max-width: 560px) {
  .sala-cab { grid-template-columns: 1fr; justify-items: center; text-align: center; }
}
</style>
</head>

<div class="wrap" id="app"></div>
<div id="capa"></div>

<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.js"></script>
<script>
"use strict";
/* =================================================================
   Céntimo — juego de cartas de finanzas personales
   Modos: un solo dispositivo, o en línea (cada jugador en su celular).
   En línea, el celular que crea la sala lleva la partida y envía a
   cada jugador solo lo que puede ver (sus cartas y la mesa).
   ================================================================= */

const URL_PUBLICA = "https://sofiavaldes19-maker.github.io/mi-juego/";

/* ================= Datos del mazo ================= */
const COLORES = {
  g: { nombre: "Ahorro", corto: "Verde" },
  b: { nombre: "Necesidades", corto: "Azul" },
  r: { nombre: "Gustos", corto: "Rojo" },
  y: { nombre: "Ingresos", corto: "Amarillo" }
};
const CODIGOS_COLOR = ["g", "b", "r", "y"];
const CAT_SINGULAR = { g: "Ahorro", b: "Necesidad", r: "Gusto", y: "Ingreso", k: "Comodín" };
const GASTOS = {
  g: ["Alcancía", "Monedas sueltas", "Cuenta de ahorro", "Ahorro automático", "Fondo de emergencia", "Depósito a plazo", "Meta de viaje", "Ahorro para estudios", "Colchón financiero"],
  b: ["Pasaje de bus", "Útiles", "Agua y luz", "Internet", "Supermercado", "Pase de transporte", "Remedios", "Almuerzos", "Arriendo"],
  r: ["Café", "Snack", "Streaming", "Cine", "Delivery", "Salida con amigos", "Ropa", "Concierto", "Celular nuevo"],
  y: ["Venta de algo usado", "Propina", "Clases particulares", "Mesada", "Turno extra", "Trabajo freelance", "Beca", "Práctica pagada", "Sueldo"]
};
const ESPECIALES = {
  imp:    { nombre: "Imprevisto", simbolo: "+2", corto: "Roba 2 y pierde turno" },
  cong:   { nombre: "Congelar cuenta", simbolo: "⊘", corto: "Pierde turno" },
  camb:   { nombre: "Cambio de plan", simbolo: "⇄", corto: "Cambia el sentido" },
  sueldo: { nombre: "Sueldo extra", simbolo: "★", corto: "Elige color" },
  deuda:  { nombre: "Deuda", simbolo: "+4", corto: "Roba 4 · elige color" }
};

let idCarta = 0;
function crearMazo(copias) {
  const m = [];
  for (let k = 0; k < copias; k++) {
    for (const c of CODIGOS_COLOR) {
      for (let v = 1; v <= 9; v++) m.push({ id: idCarta++, color: c, tipo: "num", valor: v });
      for (const t of ["imp", "cong", "camb"]) m.push({ id: idCarta++, color: c, tipo: t });
    }
    for (let i = 0; i < 4; i++) m.push({ id: idCarta++, color: "k", tipo: "sueldo" });
    for (let i = 0; i < 4; i++) m.push({ id: idCarta++, color: "k", tipo: "deuda" });
  }
  return m; // 56 cartas por copia
}
function barajar(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function nombreCarta(c) {
  if (c.tipo === "num") return `${GASTOS[c.color][c.valor - 1]} ($${c.valor} mil)`;
  return ESPECIALES[c.tipo].nombre + (c.color !== "k" ? ` ${CAT_SINGULAR[c.color].toLowerCase()}` : "");
}
function puntos(c) {
  const base = c.tipo === "num" ? c.valor : (c.color === "k" ? 15 : 10);
  return c.color === "r" ? base * 2 : base;
}

  if (d.t === "rechazo" || d.t === "cerrada") {
    salirRed(); guardar("centimo-invitado", null);
    U.modo = null; U.pantalla = "inicio"; U.V = null;
    pintar();
    modal(`<h2>${d.t === "cerrada" ? "El anfitrión cerró la sala" : "No pudiste entrar"}</h2><p>${esc(d.t === "cerrada" ? "La partida terminó. ¡Gracias por jugar!" : String(d.texto || ""))}</p>`,
      [{ txt: "Entendido", cls: "primario", fn: cerrarCapa }]);
  }
}
function enviarRed(msg) {
  if (!Red.conn || !Red.conn.open) { avisar("Sin conexión con el anfitrión. Reintentando…", true); return; }
  try { Red.conn.send(msg); } catch (e) { avisar("No se pudo enviar. Intenta de nuevo.", true); }
}
function salirRed() {
  clearInterval(Red.vigia); clearInterval(Red.ping);
  try { if (Red.conn) Red.conn.close(); } catch (e) { /* nada */ }
  try { if (Red.peer) Red.peer.destroy(); } catch (e) { /* nada */ }
  Red.peer = null; Red.conn = null; Red.conns = new Map();
  soltarPantalla();
}

/* Mantener la pantalla encendida mientras juegan. */
let bloqueo = null;
async function pantallaEncendida() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") bloqueo = await navigator.wakeLock.request("screen"); } catch (e) { /* opcional */ }
}
function soltarPantalla() { try { if (bloqueo) bloqueo.release(); } catch (e) { /* nada */ } bloqueo = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (U.modo === "host" || U.modo === "guest") pantallaEncendida();
  if (U.modo === "guest" && Red.peer && !Red.peer.destroyed) {
    if (Red.peer.disconnected) { try { Red.peer.reconnect(); } catch (e) { /* nada */ } }
    else if (!Red.conn || !Red.conn.open) conectarAnfitrion();
  }
});

const $app = document.getElementById("app");
const $capa = document.getElementById("capa");
const qs = new URLSearchParams(location.search);
const U = {
  pantalla: "inicio", modo: null, V: null, seat: null, token: null, codigo: null, nombre: "",
  red: "", error: "", aviso: null, avisoMov: -1, movVisto: -1, cortinaMov: -1, finVisto: -1, capaTipo: null,
  retomando: false, config: cargarConfig()
};
if (qs.get("sala")) { U.pantalla = "unirse"; U.codigoPre = qs.get("sala").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4); }

function cargarConfig() {
  const g = leer("centimo-config");
  if (Array.isArray(g) && g.length >= 2) return g.slice(0, 10).map(c => ({ nombre: limpiarNombre(c.nombre), bot: !!c.bot }));
  return [1, 2, 3, 4].map(i => ({ nombre: `Jugador ${i}`, bot: false }));
}
function avisar(texto, alerta) {
  U.aviso = { texto, alerta }; U.avisoMov = vistaActual() ? vistaActual().mov : -1;
  const el = document.getElementById("mensaje");
  if (el) { el.className = "mensaje" + (alerta ? " alerta" : ""); el.textContent = texto; }
}
function vistaActual() {
  if (U.modo === "guest") return U.V;
  if (G && U.modo === "host") return vista(U.seat);
  return null;
}

function pintar() {
  if (U.pantalla === "inicio") return pantallaInicio();
  if (U.pantalla === "local") return pantallaLocal();
  if (U.pantalla === "crear") return pantallaCrear();
  if (U.pantalla === "unirse") return pantallaUnirse();

  let V, puede = false;
  if (U.modo === "local") {
    const hum = G.jugadores.filter(j => !j.bot).length;
    const j = actual();
    let seat = null;
    if (G.fase === "juego" && !j.bot && hum > 1) {
      if (U.movVisto === G.mov) seat = G.turno;
      else if (U.cortinaMov !== G.mov) { U.cortinaMov = G.mov; mostrarCortina(j); }
    } else if (G.fase === "juego" && !j.bot) seat = G.turno;
    else if (hum === 1) seat = G.jugadores.findIndex(x => !x.bot);
    V = vista(seat);
  } else if (U.modo === "host") {
    V = G ? vista(U.seat) : null;
  } else {
    V = U.V;
  }
  if (!V) return pantallaConectando();
  if (V.fase === "sala") { if (U.capaTipo === "fin") cerrarCapa(); return pantallaSala(V); }
  puede = V.fase === "juego" && V.seat !== null && V.turno === V.seat;
  if (!puede && U.capaTipo === "jugada") cerrarCapa();
  if (V.fase === "juego" && U.capaTipo === "fin") cerrarCapa();
  pantallaJuego(V, puede);
  const claveFin = (U.codigo || "") + "-" + V.mov;
  if (V.fase === "fin" && U.finVisto !== claveFin) { U.finVisto = claveFin; mostrarResultados(V); }
}

        <span class="nombre">${esc(p.nombre)}</span>
        <span class="info"><i class="mini"></i>${p.n} ${p.n === 1 ? "carta" : "cartas"}</span>
        <span class="info">${i === V.seat && enRed ? `<span class="badge tu">Tú</span>` : ""}${p.bot ? `<span class="badge bot">Compu</span>` : ""}${!p.conectado ? `<span class="badge off">Sin conexión</span>` : ""}${p.escudo ? `<span class="badge escudo">Escudo</span>` : ""}${p.n === 1 ? `<span class="badge ultimo">Último gasto</span>` : ""}</span>
      </div>`).join("")}
    </div>

    <div class="centro">
      <div class="pila">
        <button class="carta dorso" id="b-mazo" ${puede ? "" : "disabled"} aria-label="Robar una carta y pasar"><span class="inner"><span class="big">¢</span></span></button>
        <small>Mazo · ${V.mazoN}</small>
      </div>
      <div class="descarte">${t ? htmlCarta(t, "grande", 'tabindex="-1" aria-disabled="true"') : ""}<small>Carta en juego</small></div>
      <div class="estado">
        <span class="color-actual c-${V.color}"><i></i>Color: ${COLORES[V.color] ? COLORES[V.color].nombre : ""}</span>
        <span class="sentido">Sentido: ${V.sentido === 1 ? "→ hacia la derecha" : "← hacia la izquierda"}</span>
      </div>
    </div>

    <div class="mensaje ${alerta ? "alerta" : ""}" id="mensaje" aria-live="polite">${esc(msg)}</div>

    <section class="zona-mano" aria-label="Tu mano">
      ${yo ? `
        <div class="titulo"><h2>${enRed ? "Tus cartas" : `Cartas de ${esc(yo.nombre)}`}${puede ? ` <span class="turno-tuyo">· ¡te toca!</span>` : ""}</h2>
          ${puede ? `<p class="pista">Juega color <b>${COLORES[V.color].nombre}</b>${t.tipo === "num" ? ` o número <b>${t.valor}</b>` : ""}, o un comodín.</p>` : `<p class="pista">${V.fase === "juego" ? `Espera tu turno. Ahora juega <b>${esc(turnoNom)}</b>.` : "Ronda terminada."}</p>`}
        </div>
        ${puede && V.acusable !== null ? `<div class="acusar"><p><b>${esc(V.jugadores[V.acusable].nombre)}</b> quedó con una carta y no dijo "¡Último gasto!".</p><button class="btn peligro chico" id="b-acusar">Acusar: roba 2</button></div>` : ""}
        ${necAviso ? `<div class="aviso-nec">Necesidades primero: tienes una carta azul que puedes pagar antes que tus Gustos.</div>` : ""}
        <div class="mano">${V.mano.map((c, i) => {
          const cls = puede ? (combina(c, t, V.color) ? "jugable" : "nojugable") : "";
          return htmlCarta(c, cls + (c.id === V.nueva ? " nueva" : ""), `data-c="${i}" ${puede ? "" : 'tabindex="-1"'}`);
        }).join("")}</div>
        ${puede ? `<div class="acciones">
          <button class="btn" id="b-robar">Robar carta y pasar</button>
          <button class="btn ${V.dijo ? "dicho" : "primario"}" id="b-ultimo" ${V.mano.length === 2 ? "" : "disabled"}>${V.dijo ? "Dijiste: ¡Último gasto!" : "¡Último gasto!"}</button>
        </div>` : ""}`
      : `<p class="espera">Las cartas están ocultas hasta que el próximo jugador las destape.</p>`}
    </section>

    <ul class="bitacora" aria-label="Lo que ha pasado">${V.bitacora.slice(0, 5).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
  </div>`;

  $app.querySelector("#b-reglas").onclick = mostrarReglas;
  $app.querySelector("#b-salir").onclick = salirConfirmar;
  if (!puede) return;
  $app.querySelectorAll("[data-c]").forEach(el => el.onclick = () => tocarCarta(V, +el.dataset.c, el));
  $app.querySelector("#b-mazo").onclick = () => enviar({ t: "robar" });
  $app.querySelector("#b-robar").onclick = () => enviar({ t: "robar" });
  $app.querySelector("#b-ultimo").onclick = () => enviar({ t: "ultimo" });
  const ba = $app.querySelector("#b-acusar");
  if (ba) ba.onclick = () => enviar({ t: "acusar" });
}

/* Enviar una jugada: en local/anfitrión va directo al motor; el invitado la manda por la red. */
function enviar(a) {
  if (U.modo === "guest") { enviarRed(a); return; }
  const pi = U.modo === "local" ? G.turno : U.seat;
  const err = accion(pi, a);
  if (err) avisar(err, true);
}
function tocarCarta(V, idx, el) {
  const c = V.mano[idx];
  if (!c) return;
  if (!combina(c, V.tope, V.color)) {
    el.classList.remove("sacude"); void el.offsetWidth; el.classList.add("sacude");
    const t = V.tope;
    avisar(`Esa carta no combina. Necesitas color ${COLORES[V.color].nombre}${t.tipo === "num" ? ` o el número ${t.valor}` : ` u otra carta "${ESPECIALES[t.tipo].nombre}"`}, o un comodín.`, true);
    return;
  }
  const seguir = () => {
    if (c.color === "k") elegirColor(col => enviar({ t: "jugar", idx, color: col }));
    else enviar({ t: "jugar", idx });
  };
  if (c.color === "r" && hayNecesidad(V.mano, idx, V.tope, V.color)) {
    modal(`<h2>Necesidades primero</h2>
      <p>Tienes una carta <b>azul (Necesidad)</b> que puedes pagar ahora. Si juegas este Gusto, <b>robas 2 cartas de castigo</b>.</p>`,
      [{ txt: "Volver y elegir otra", cls: "primario", fn: cerrarCapa },
       { txt: "Jugar el Gusto igual (+2)", cls: "peligro", fn: () => { cerrarCapa(); seguir(); } }], "", "jugada");
    return;
  }
  seguir();
}
function elegirColor(fn) {
  modal(`<h2>¿Qué color sigue?</h2>
    <div class="elige-color">${CODIGOS_COLOR.map(k => `<button class="c-${k}" data-col="${k}">${COLORES[k].nombre}<small>${COLORES[k].corto}</small></button>`).join("")}</div>`,
    [{ txt: "Cancelar", fn: cerrarCapa }], "", "jugada");
  $capa.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { cerrarCapa(); fn(b.dataset.col); });
}
function salirConfirmar() {
  const textos = {
    host: ["¿Cerrar la sala?", "La partida termina para todos los jugadores."],
    guest: ["¿Salir de la sala?", "Si la partida está en curso, la compu jugará tus turnos."],
    local: ["¿Salir de la partida?", "Se perderá la ronda en curso."]
  }[U.modo] || ["¿Salir?", ""];
  modal(`<h2>${textos[0]}</h2><p>${textos[1]}</p>`,
    [{ txt: "Seguir jugando", cls: "primario", fn: cerrarCapa },
     { txt: U.modo === "host" ? "Cerrar sala" : "Salir", cls: "peligro", fn: () => {
       cerrarCapa();
       if (U.modo === "host") { cerrarSala(); return; }
       if (U.modo === "guest") {
         try { if (Red.conn && Red.conn.open) Red.conn.send({ t: "adios" }); } catch (e) { /* nada */ }
         guardar("centimo-invitado", null);
         setTimeout(salirRed, 300);
         U.V = null;
       }
       clearTimeout(relojMotor);
       if (U.modo === "local") G = null;
       U.modo = null; U.pantalla = "inicio"; pintar();
     } }]);
}

/* ================= Capas (ventanas) ================= */
function modal(html, botones, clase = "", tipo = null) {
  U.capaTipo = tipo;
  $capa.innerHTML = `<div class="capa ${clase}" role="dialog" aria-modal="true"><div class="caja">${html}
    <div class="botones">${botones.map((b, i) => `<button class="btn ${b.cls || ""}" data-b="${i}">${b.txt}</button>`).join("")}</div></div></div>`;
  $capa.querySelectorAll("[data-b]").forEach(el => el.onclick = () => botones[+el.dataset.b].fn());
  const f = $capa.querySelector(".btn.primario") || $capa.querySelector("button");
  if (f) f.focus();
}
function cerrarCapa() { $capa.innerHTML = ""; U.capaTipo = null; }
function mostrarCortina(j) {
  const ult = G.bitacora.slice(0, 4).reverse();
  modal(`<p class="nota">Pasa el dispositivo a</p>
    <div class="grande-nombre">${esc(j.nombre)}</div>
    <p class="nota">Los demás, ¡no miren las cartas!</p>
    ${ult.length ? `<ul>${ult.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}`,
    [{ txt: "Ver mis cartas", cls: "primario", fn: () => { cerrarCapa(); U.movVisto = G.mov; pintar(); } }],
    "cortina", "cortina");
}
function mostrarReglas() {
  modal(`<h2>Cómo se juega Céntimo</h2>
    <p>Eres un estudiante que empieza el mes con 7 gastos pendientes. Gana quien deja su mano en cero: <b>cierra su presupuesto</b>.</p>
    <div class="reglas"><ol>
      <li><b>Combina.</b> Juega una carta del mismo color (categoría) o del mismo número (monto) que la del centro. Si no puedes, roba una carta y pasa.</li>
      <li><b>Necesidades primero.</b> Si juegas un Gusto rojo teniendo una Necesidad azul que podías jugar, robas 2 cartas de castigo.</li>
      <li><b>Escudo de ahorro.</b> Al jugar una carta verde quedas protegido: el próximo Imprevisto o Deuda que te lancen no te afecta.</li>
      <li><b>Especiales.</b> Imprevisto (+2 y pierde turno), Congelar cuenta (pierde turno), Cambio de plan (cambia el sentido). Los comodines Sueldo extra y Deuda (+4) se juegan siempre.</li>
      <li><b>¡Último gasto!</b> Antes de quedar con una carta, toca el botón. Si lo olvidas, el siguiente jugador puede acusarte y robas 2.</li>
    </ol></div>
    <p class="nota">Puntaje final: cada carta vale su número, las rojas valen el doble, las especiales 10 y los comodines 15. Menos puntos es mejor.</p>`,
    [{ txt: "Entendido", cls: "primario", fn: cerrarCapa }]);
}
function mostrarResultados(V) {
  const tag = p => p === 0 ? `<span class="tag cerrado">Presupuesto cerrado</span>` : p <= 25 ? `<span class="tag justo">Vas justo</span>` : `<span class="tag rojo">En rojo</span>`;
  const manda = U.modo === "local" || U.modo === "host";
  const botones = manda
    ? [{ txt: "Jugar otra ronda", cls: "primario", fn: () => { cerrarCapa(); empezarRonda(); } },
       U.modo === "host"
         ? { txt: "Volver a la sala", fn: () => { cerrarCapa(); G.fase = "sala"; G.jugadores = G.jugadores.filter(j => j.bot || j.conectado); cambio(); } }
         : { txt: "Volver al inicio", fn: () => { cerrarCapa(); G = null; U.modo = null; U.pantalla = "inicio"; pintar(); } }]
    : [{ txt: "Ver la mesa", cls: "primario", fn: cerrarCapa }];
  modal(`<h2>¡${esc(V.ganador || "")} cerró su presupuesto!</h2>
    <p class="nota">Ronda ${V.ronda}. Los demás suman los gastos que les quedaron en la mano.</p>
    <div class="scroll-x"><table class="tabla">
      <thead><tr><th>Jugador</th><th>Resultado</th><th class="num">Ronda</th><th class="num">Total</th></tr></thead>
      <tbody>${(V.resultados || []).map(f => `<tr><td>${esc(f.nombre)}</td><td>${tag(f.puntos)}</td><td class="num">${f.puntos}</td><td class="num">${f.total}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="leccion">Pagar primero lo necesario y mantener ahorro de respaldo reduce los gastos pendientes. Los gustos pesan el doble cuando se dejan acumular.</p>
    ${manda ? "" : `<p class="esperando">Esperando que el anfitrión empiece otra ronda…</p>`}`,
    botones, "", "fin");
}

/* ================= App instalable ================= */
let avisoInstalar = null;
const esApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function puedeInstalar() { return !esApp() && !enMarco() && location.protocol !== "file:"; }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; });
window.addEventListener("appinstalled", () => { avisoInstalar = null; if (U.pantalla === "inicio") pintar(); });
function instalarApp() {
  if (avisoInstalar) {
    avisoInstalar.prompt();
    avisoInstalar.userChoice.finally(() => { avisoInstalar = null; });
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  modal(`<h2>Instalar Céntimo</h2>
    ${ios
      ? `<p>En iPhone o iPad, desde <b>Safari</b>:</p><ol><li>Toca el botón <b>Compartir</b> (el cuadrado con una flecha hacia arriba).</li><li>Elige <b>Agregar a inicio</b>.</li><li>Toca <b>Agregar</b>.</li></ol>`
      : `<p>En Android, desde <b>Chrome</b>:</p><ol><li>Toca el menú <b>⋮</b> arriba a la derecha.</li><li>Elige <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</li></ol><p>En computador, busca el ícono de instalar en la barra de direcciones.</p>`}
    <p class="nota">Céntimo aparecerá con su ícono junto a tus otras apps. El modo de un solo dispositivo funciona sin internet; para jugar cada uno en su celular se necesita internet.</p>`,
    [{ txt: "Entendido", cls: "primario", fn: cerrarCapa }]);
}
if ("serviceWorker" in navigator && location.protocol !== "file:" && !enMarco()) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* Si el invitado recarga la página (o vuelve a abrir el link), vuelve solo a su sala. */
(function volverSolo() {
  const inv = leer("centimo-invitado");
  if (U.codigoPre && inv && inv.codigo === U.codigoPre && inv.t && Date.now() - inv.t < 3 * 3600 * 1000 && enLineaPosible()) {
    unirseSala(inv.codigo, inv.nombre);
    return;
  }
  pintar();
})();
</script>
